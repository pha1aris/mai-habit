<svg xmlns="http://www.w3.org/2000/svg" width="920" height="984" viewBox="0 0 920 984" role="img" aria-label=" Terminal output of the mai-habit plan command" font-family="ui-monospace, SFMono-Regular, Consolas, 'Microsoft YaHei', monospace">
<rect width="920" height="984" rx="10" fill="#0d1117"/>
<path d="M0 36V10a10 10 0 0 1 10-10h900a10 10 0 0 1 10 10v26z" fill="#161b22"/>
<circle cx="22" cy="18" r="6" fill="#ff5f57"/>
